# The only place where corpora are defined. For each Legifrance code: the label shown as the
# source of its chunks, and the articles kept (regex on the article number, theme for
# scope.theme). Only in-force articles are fetched.
legifrance:
  code_travail:
    label: Code du travail, Legifrance
    text_id: LEGITEXT000006072050
    patterns:
      - {regex: '^[LRD]62\d\d-', theme: apprentissage}
      - {regex: '^[LRD]314[1-6]-', theme: conges}
      - {regex: '^[LRD]3261-', theme: transport}
      - {regex: '^[LRD]3262-', theme: titres_restaurant}
      - {regex: '^[LRD]5221-', theme: etranger}
      - {regex: '^L1222-(9|10|11)$', theme: teletravail}
      - {regex: '^L3121-(18|19|20|21|22|27)$', theme: duree_travail}   # durees maximales, duree legale
      - {regex: '^[LRD]316[0-5]-', theme: jeunes}                      # jeunes travailleurs: duree, nuit, repos
      - {regex: '^L3132-(1|2|3)$', theme: repos}                       # repos hebdomadaire, dimanche
      - {regex: '^L4624-1$', theme: sante_travail}                     # visite d'information et de prevention
      - {regex: '^L2254-1$', theme: conventions}                       # principe de faveur
      - {regex: '^L6332-14$', theme: apprentissage}                    # prise en charge du contrat par l'OPCO
  ceseda:
    label: CESEDA, Legifrance
    text_id: LEGITEXT000006070158
    patterns:
      - {regex: '^[LRD]\*?422-', theme: etranger}
      - {regex: '^L414-1[0-5]$', theme: etranger}
      - {regex: '^L433-3$', theme: etranger}
  securite_sociale:   # mutuelle: obligation, portability, minimum cover, exemptions
    label: Code de la securite sociale, Legifrance
    text_id: LEGITEXT000006073189
    patterns:
      - {regex: '^L911-(1|7|7-1|8)$', theme: mutuelle}
      - {regex: '^D911-', theme: mutuelle}
      - {regex: '^R242-1-6$', theme: mutuelle}

