# All settings in one place: change them here, not in the code.
model:
  # Default: Groq (free plan, rate-limited). Key in .env as GROQ_API_KEY.
  base_url: https://api.groq.com/openai/v1
  name: openai/gpt-oss-20b
  api_key_env: GROQ_API_KEY
  # Cerebras (trial credits, needs a payment method):
  #   base_url: https://api.cerebras.ai/v1   name: gpt-oss-120b      api_key_env: CEREBRAS_API_KEY
  # Local, when data must stay on the laptop or offline (ollama pull llama3.2):
  #   base_url: http://localhost:11434/v1    name: llama3.2          api_key_env: none
  temperature: 0
  # gpt-oss is a reasoning model: its reasoning tokens count in max_tokens, 400 cut answers short
  max_tokens: 2000
  reasoning_effort: low
prompt_file: prompts/system_v1.txt
corpus_snapshot: 2026-10-25   # date of the data files (Licence Ouverte: cite the source and its date)
rewrite:              # French version of the question (app/pipeline.py), about 200 tokens per call.
  # Not llama3.2: it answered instead of translating (E6). gpt-oss-120b has its own Groq quota.
  base_url: https://api.groq.com/openai/v1
  name: openai/gpt-oss-120b
  api_key_env: GROQ_API_KEY
judge:                # eval/judge.py: grades the answers (replaces contains_reference), calibrated on human labels.
  # Not the answer model (gpt-oss): an LLM tends to prefer its own answers. Check the name on
  # console.groq.com/docs/models; JUDGE_MODEL=ollama:qwen3:8b judges locally instead.
  base_url: https://api.groq.com/openai/v1
  name: qwen/qwen3.8-27b   # llama-3.3-70b-versatile was removed from Groq; the only non-gpt-oss chat model left
  api_key_env: GROQ_API_KEY
retrieval:            # rag/retrieve.py
  enabled: true
  signals: [exact, fulltext, dense]   # remove one to measure what it brings
  candidates_per_signal: 20
  rerank: true
  rerank_candidates: 30
  top_k: 5
  max_per_doc: 1           # passages per article or fiche given to the model (E12: 5 distinct documents, Recall@5 0.80 -> 0.85)
  sector_priority: true    # public-sector texts after the others unless the question is about the public sector (E14)
  rewrite_fr: true          # French version of the question for the reranker and the full text search
  # Reranker score under which the answer is NOT FOUND. Set on the draft test set (30 Oct.): unanswerable
  # questions scored <= 0.009, answerable ones >= 0.024. Optimistic until checked on new questions.
  abstain_threshold: 0.015
evaluation:
  testset: eval/testset.jsonl
  report: eval/report.json
database:             # connection string read from DATABASE_URL in .env
  table: chunks
  schema_file: db/schema.sql
legifrance:           # keys in .env are PISTE production keys.
  oauth_url: https://oauth.piste.gouv.fr/api/oauth/token
  api_url: https://api.piste.gouv.fr/dila/legifrance/lf-engine-app
  request_delay_s: 0.2
service_public:       # open data DILA, one zip per audience, one XML per fiche
  particuliers_zip: https://www.data.gouv.fr/api/1/datasets/r/0ed10f28-d197-4324-97b3-037f625095ac
  entreprendre_zip: https://www.data.gouv.fr/api/1/datasets/r/93c81767-6ae6-4b31-8dd7-2158e560d181
