# All settings in one place: change them here, not in the code.
model:
  # Default: Groq (free plan, rate-limited). Key in .env as GROQ_API_KEY.
  base_url: https://api.groq.com/openai/v1
  name: openai/gpt-oss-20b
  api_key_env: GROQ_API_KEY
  # Cerebras (trial credits, needs a payment method):
  #   base_url: https://api.cerebras.ai/v1   name: gpt-oss-120b      api_key_env: CEREBRAS_API_KEY
  # Local, when data must stay on the laptop or offline (ollama pull llama3.2):
  #   base_url: http://localhost:11434/v1    name: llama3.2          api_key_env: none
  temperature: 0
  # gpt-oss is a reasoning model: its reasoning tokens count in max_tokens, 400 cut answers short
  max_tokens: 2000
  reasoning_effort: low
prompt_file: prompts/system_v1.txt
labels:               # rag/index.py --labels: one call per document, run once. Local, so the free
  # Groq quota (8000 tokens/min, 1000 requests/day) stays for the answers and the evaluation.
  base_url: http://localhost:11434/v1
  name: llama3.2
  api_key_env: none
retrieval:            # rag/retrieve.py
  enabled: true
  signals: [exact, fulltext, dense, labels]   # remove one to measure what it brings
  candidates_per_signal: 20
  rerank: true
  rerank_candidates: 30
  top_k: 5
  rewrite_fr: true          # French version of the question for the reranker and the full text search
  abstain_threshold: 0.0    # reranker score under which the answer is NOT FOUND, set from the test set
evaluation:
  testset: eval/testset.jsonl
  report: eval/report.json
database:             # connection string read from DATABASE_URL in .env
  table: chunks
  schema_file: db/schema.sql
legifrance:           # keys in .env are PISTE sandbox keys: sandbox URLs. Production keys: drop "sandbox-".
  oauth_url: https://sandbox-oauth.piste.gouv.fr/api/oauth/token
  api_url: https://sandbox-api.piste.gouv.fr/dila/legifrance/lf-engine-app
  request_delay_s: 0.2
service_public:       # open data DILA, one zip per audience, one XML per fiche
  particuliers_zip: https://www.data.gouv.fr/api/1/datasets/r/0ed10f28-d197-4324-97b3-037f625095ac
  entreprendre_zip: https://www.data.gouv.fr/api/1/datasets/r/93c81767-6ae6-4b31-8dd7-2158e560d181
