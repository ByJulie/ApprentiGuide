services:
  db:
    image: pgvector/pgvector:0.8.1-pg16
    restart: unless-stopped   # back by itself when Docker Desktop restarts
    environment:
      POSTGRES_USER: apprentiguide
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: apprentiguide
    ports:
      - "127.0.0.1:${DB_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
volumes:
  pgdata:
